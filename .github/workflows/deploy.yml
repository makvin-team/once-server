name: once-server · build & deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: once-server-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/once-server
  CONTAINER_NAME: once-server-api
  NETWORK: once-net
  HOST_PORT: "44010"
  CONTAINER_PORT: "8080"

jobs:
  build:
    name: build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_CONFIGURATION=Release
            ASPNETCORE_ENVIRONMENT=Production
          cache-from: type=gha,scope=once-server
          cache-to: type=gha,mode=max,scope=once-server

      - id: image
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull & restart container
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE:   ${{ needs.build.outputs.image }}
          APP_ENV: ${{ secrets.APP_ENV }}
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          port:     ${{ secrets.DEPLOY_PORT || 22 }}
          envs:     IMAGE,APP_ENV
          script: |
            set -euo pipefail

            # Shared network for all once-* services
            docker network inspect ${{ env.NETWORK }} >/dev/null 2>&1 \
              || docker network create ${{ env.NETWORK }}

            # Auth + pull
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull "$IMAGE"

            # Write the APP_ENV secret to a tmpfs file, mount via --env-file,
            # then shred it after the container starts. The container keeps
            # the env vars in its own namespace; the file is gone immediately.
            TMP=$(mktemp)
            chmod 600 "$TMP"
            printf '%s\n' "$APP_ENV" > "$TMP"

            # Replace the container.
            docker rm -f ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              --network ${{ env.NETWORK }} \
              --env-file "$TMP" \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e ASPNETCORE_URLS=http://+:${{ env.CONTAINER_PORT }} \
              -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
              --health-cmd "curl -fs http://localhost:${{ env.CONTAINER_PORT }}/health || exit 1" \
              --health-interval=30s \
              --health-timeout=5s \
              --health-retries=3 \
              --health-start-period=60s \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              "$IMAGE"

            shred -u "$TMP" 2>/dev/null || rm -f "$TMP"
            docker image prune -f
